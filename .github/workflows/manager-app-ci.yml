name: Manager app CI

on:
  push:
    branches: [main]
    paths: ['manager-app/**', 'sim-engine/**', '.github/workflows/manager-app-ci.yml']
  pull_request:
    paths: ['manager-app/**', 'sim-engine/**', '.github/workflows/manager-app-ci.yml']

defaults:
  run:
    working-directory: manager-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            manager-app/package-lock.json
            sim-engine/package-lock.json
      - run: npm run build:engine
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: manager-app/test-results
          retention-days: 7
