# ============================================================
# CONTENT PLAN — what gets generated, when, and where.
# One entry per post. The AI writes the copy; you decide the topic.
#
# Fields:
#   id        unique, stable (used for files and board cards)
#   date      YYYY-MM-DD   time  HH:MM (in AUTOPILOT_TZ)
#   channels  which channels to publish to
#   pillar    key from brand.yaml pillars
#   format    carousel | single | story
#   template  name from brand/templates/templates.yaml
#   topic     what the post is about (one or two sentences is enough)
#   angle     optional: hook style / point of view
#   cta       freebie | core | engagement
#   notes     optional: facts, numbers, quotes the AI may use verbatim
#   approved_story  true if a client story may be told with real details
# ============================================================

timezone: Europe/Berlin
default_time: "09:00"

weeks:
  - week: 1
    theme: "Why ads alone won't get you there"
    posts:
      - id: w1-p1
        date: 2026-09-14
        channels: [instagram, tiktok, linkedin]
        pillar: mindset
        format: carousel
        template: tip-carousel
        topic: "The hidden cost of relying only on paid ads: rising CPMs, zero ownership, revenue that stops the day the budget stops."
        angle: "Reality check, not doom. End with the alternative."
        cta: freebie

      - id: w1-p2
        date: 2026-09-15
        channels: [instagram, linkedin]
