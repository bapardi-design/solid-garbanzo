<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="{{brand.visual.fonts.google_fonts_url}}">
<style>
  :root {
    --primary: {{brand.visual.colors.primary}};
    --secondary: {{brand.visual.colors.secondary}};
    --accent: {{brand.visual.colors.accent}};
    --accent-soft: {{brand.visual.colors.accent_soft}};
    --on-dark: {{brand.visual.colors.text_on_dark}};
    --on-light: {{brand.visual.colors.text_on_light}};
    --heading: {{{brand.visual.fonts.heading}}};
    --body: {{{brand.visual.fonts.body}}};
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: {{width}}px; height: {{height}}px; overflow: hidden; }
  body { font-family: var(--body); -webkit-font-smoothing: antialiased; }
  .frame { position: relative; width: 100%; height: 100%; padding: 96px; display: flex; flex-direction: column; }
  .logo { font-family: var(--body); font-weight: 600; letter-spacing: 0.32em; font-size: 22px; text-transform: uppercase; }
  .kicker { font-family: var(--body); font-weight: 500; font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase; opacity: .7; }
  h1 { font-family: var(--heading); font-weight: 600; line-height: 1.05; letter-spacing: -0.01em; }
  p  { font-family: var(--body); line-height: 1.4; }
  .rule { height: 4px; width: 120px; background: var(--accent); border-radius: 2px; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; font-size: 24px; opacity: .8; }
  .swipe { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; color: var(--accent); }
</style></head>
<body style="background: var(--secondary); color: var(--on-light);">
<div class="frame">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div class="logo">{{brand.visual.logo_text}}</div>
    <div class="kicker">{{slide.index}} / {{slide.total}}</div>
  </div>
  <div style="margin-top: 140px;">
    <div style="font-family: var(--heading); font-size: 120px; line-height: 1; color: var(--accent);">{{slide.index}}</div>
    <div class="rule" style="margin: 28px 0 40px;"></div>
    <h1 style="font-size: 84px; max-width: 880px;">{{slide.title}}</h1>
    <p style="font-size: 38px; margin-top: 44px; max-width: 820px;">{{slide.body}}</p>
  </div>
  <div class="foot">
    <span>{{brand.tagline}}</span>
    <span class="swipe">&rarr;</span>
  </div>
</div>
</body></html>
